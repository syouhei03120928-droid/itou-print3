<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いとう印刷</title>

<style>
body {
  margin:0;
  font-family:"Hiragino Kaku Gothic ProN", sans-serif;
  background:#f5f7fa;
  color:#333;
}

/* ヘッダー */
header {
  height:90vh;
  background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
              url('https://images.unsplash.com/photo-1581092334651-ddf26d9a09d0');
  background-size:cover;
  background-position:center;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* ロゴ */
.logo {
  position:absolute;
  top:20px;
  left:20px;
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon {
  width:18px;
  height:18px;
  border-radius:50%;
  background: linear-gradient(45deg,#00c6ff,#0072ff,#6a11cb);
}

.logo-text {
  font-size:20px;
  font-weight:bold;
}

/* キャッチコピー */
.hero h1 {
  font-size:40px;
  margin-bottom:10px;
}

.hero p {
  font-size:18px;
  opacity:0.8;
}

/* セクション */
section {
  padding:60px 20px;
  max-width:1000px;
  margin:auto;
}

/* カード */
.card {
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
  margin-bottom:20px;
}

/* フッター */
footer {
  background:#222;
  color:#aaa;
  text-align:center;
  padding:20px;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <span class="logo-icon"></span>
    <span class="logo-text">いとう印刷</span>
  </div>

  <div class="hero">
    <h1>印刷で、伝わる力を。</h1>
    <p>福井の印刷ならお任せください</p>
  </div>
</header>

<section>
  <div class="card">
    <h2>サービス</h2>
    <p>チラシ・名刺・パンフレットなど幅広く対応しております。</p>
  </div>

  <div class="card">
    <h2>会社情報</h2>
    <p>
      福井県福井市花堂東1-27-2<br>
      TEL：0776-34-8787<br>
      MAIL：i-print@sky.plala.or.jp
    </p>
  </div>
</section>

<footer>
  © いとう印刷
</footer>

</body>
</html>
