<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いとう印刷</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#000;
}

/* 背景画像 */
.hero {
  position:relative;
}

.hero img {
  width:100%;
  height:auto;
  display:block;
}

/* 黒グラデで高級感 */
.overlay {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.3));
}

/* ロゴ */
.logo {
  position:absolute;
  top:20px;
  left:20px;
  color:white;
  font-size:22px;
  font-weight:bold;
  letter-spacing:2px;
}

/* キャッチコピー */
.catch {
  position:absolute;
  bottom:60px;
  left:30px;
  color:white;
}

.catch h1 {
  font-size:32px;
  margin:0;
}

.catch p {
  font-size:16px;
  opacity:0.8;
}
</style>
</head>

<body>

<div class="hero">
  <img src="top.png" alt="いとう印刷">

  <div class="overlay"></div>

  <div class="logo">いとう印刷</div>

  <div class="catch">
    <h1>印刷で、伝わる力を。</h1>
    <p>福井の印刷ならお任せください</p>
  </div>
</div>

</body>
</html>
